<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F5C4A" />
    <title>Offline · Dukaan</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f8f5ef;
        color: #1f1d1a;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        border: 1px solid #e6dfd2;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      img { width: 64px; height: 64px; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { margin: 0; color: #6b665d; font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 20px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: #0f5c4a;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #0f5c4a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Check your internet connection. New orders will appear as soon as you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
